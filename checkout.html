<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - MN Clothing</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                MN CLOTHING
            </a>

            <nav class="nav-menu">

                <a href="index.html">Home</a>
                <a href="index.html#women">Women</a>
                <a href="index.html#women-products">Men</a>
                <a href="index.html#women-products">New Arrivals</a>
                <a href="index.html#women-products">Sale</a>

            </nav>

            <div class="nav-actions">

                <a href="cart.html" class="nav-icon">
                    🛒
                </a>

            </div>

        </div>

    </header>


    <!-- Checkout -->
    <main class="checkout-section">

        <div class="container">

            <div class="section-heading">

                <p class="section-subtitle">
                    COMPLETE YOUR ORDER
                </p>

                <h1>Checkout</h1>

            </div>


            <div class="checkout-layout">

                <!-- Customer Information -->

                <div class="checkout-form">

                    <h2>Delivery Information</h2>

                    <form id="checkoutForm">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            required
                        >


                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >


                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            required
                        >


                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            required
                        ></textarea>


                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            required
                        >


                        <h2>Payment Method</h2>

                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked
                            >

                            Cash on Delivery

                        </label>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            PLACE ORDER
                        </button>

                    </form>

                </div>


                <!-- Order Summary -->

                <div class="checkout-summary">

                    <h2>Order Summary</h2>

                    <div id="checkoutItems"></div>

                    <div class="checkout-total">

                        <span>Total</span>

                        <strong id="checkoutTotal">
                            Rs. 0
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
